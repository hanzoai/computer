name: CI
# Moved from .github/workflows/ci.yml. This forge collects workflows from the
# FIRST of WORKFLOW_DIRS that exists, so once .hanzo/workflows/deploy.yml landed,
# anything left under .github/workflows stopped running here — silently, with a
# green repo. The tests live where the deploy lives.
#
# The `deploy` job that used to close this file (configure-pages +
# upload-pages-artifact + deploy-pages) is GONE, not disabled: hanzo.computer
# ships as ghcr.io/hanzoai/computer via deploy.yml, and a second publisher for one
# host is how a fix lands on the copy nobody is looking at.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: E2E Tests
    continue-on-error: true  # App requires Supabase env vars to render
    timeout-minutes: 60
    runs-on: hanzo-build-linux-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

      # v3, not v4+: this workflow runs on git.hanzo.ai, which presents as
      # GHES, and the v4 action refuses outright -- "GHESNotSupportedError:
      # @actions/artifact v2.0.0+ ... not currently supported on GHES". The
      # job builds its artifact and then discards it at the last step, so a
      # successful build reads as a failed run.
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    name: Build
    runs-on: hanzo-build-linux-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A compile gate, nothing more. The artifact this job used to upload existed
      # only to hand dist/ to the Pages deploy; what ships now is the image.
      - name: Build
        run: npm run build
